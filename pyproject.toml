[project]
name = "sanitary"
dynamic = ["version"]
description = "Utility to remove or replace sensitive data from complex structures."
readme = "docs/index.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = []
authors = [
  { name = "Berislav Lopac", email = "berislav@lopac.net" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
repository = "https://github.com/berislavlopac/sanitary"
issues = "https://github.com/berislavlopac/sanitary/issues"
documentation = "https://sanitary.readthedocs.io"

[project.optional-dependencies]
docs = [
  "mkdocs",
  "mkapi",
  "mkdocs-materialx",
  "pymdown-extensions",
  "jinja2 >= 3.1.3",
]

[dependency-groups]
dev = [
    "ruff",
    "pydocstyle[toml]",
    "deptry>=0.23.0",
    "towncrier>=24.8.0",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-spec",
    "pyrefly",
    "structlog",
    "tox>=4.26.0",
    "tox-uv>=1.25.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Used when building outside a tagged checkout (sdist without .git, or a shallow
# clone such as Read the Docs). Tagged builds derive the version from the tag.
fallback_version = "0.0.0"

[tool.uv]
default-groups = "all"

[tool.ruff]
line-length = 96
output-format = "grouped"

[tool.ruff.lint]
# see https://docs.astral.sh/ruff/settings/#lint
select = [  # see https://docs.astral.sh/ruff/rules/
    "E4", "E7", "E9",  # basic pycodestyle rules
    "F",        # Pyflakes rules
    "W",        # pycodestyle warnings
    "C90",      # McCabe complexity
    "N",        # PEP8 naming conventions
    "I",        # import statements linting and formatting
    "PLR",      # Pylint refactoring recommendations
    "PTH",      # recommends to use pathlib instead of os.path
    "UP",       # pyupgrade suggestions
    "BLE",      # locates blind exception capture
    "B",        # locates possible bugs and design problems
    "A",        # locates shadowing of builtin names
    "C4",       # locates possible issues with comprehensions
    "DTZ",      # locates incorrect use of timezone information
    "PIE",      # miscellaneous linting rules
    "TRY",      # locates potential exception handling antipatterns
    "PERF",     # locates potential performance issues
    "RUF",      # various Ruff-specific linting rules
    "S",        # various insecure code, with bandit
    "ERA",      # eradicate: commented-out code
]
external = [
    "F841",     # vulture uses this code for ignoring unused names
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",     # allow unused imports
    "F403",     # allow `import *`
]
"tests/*" = [
    "PLR0913",  # unlimited function arguments
    "S101",     # allow asserts
    "S105",     # allow harcoded passwords
    "N802",     # allow variable case in test names
    "PLR2004",  # allow magic values in comparisons
]
"scripts/*" = [
    "S603",     # subprocess call with trusted, hardcoded arguments
    "S607",     # partial executable path (e.g. "git") is fine for dev tooling
]

[tool.ruff.format]
# see https://docs.astral.sh/ruff/settings/#format

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

[tool.coverage.run]
source = [ "sanitary/", ]
omit = [ "*/tests/*", "src/tests/*", ]

[tool.coverage.report]
skip_covered = false
show_missing = true
fail_under = 90
exclude_lines = ["pragma: no cover", "@abstract", "if TYPE_CHECKING:"]

[tool.pyrefly]
project-includes = ["sanitary/"]
search-path = ["."]

[tool.pydocstyle]
add-ignore = "D105, D107, D212, D401"
convention = "google"
match-dir = "(?!tests).*"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "mkdocs",
    "mkapi",
    "mkdocs-materialx",
    "pymdown-extensions",
    "jinja2",
    "towncrier",  # release-time CLI tool, never imported
]

[tool.towncrier]
directory = "release-notes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
underlines = ["", "", ""]
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true


[tool.tox]
isolated_build = true
envlist = ["checks", "py310", "py311", "py312", "py313"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
skip_install = true
groups = ["test"]
commands = [
    ["pytest", "--cov", "--spec", "--junitxml=test-reports{/}{envname}-junit.xml"],
    ["coverage", "xml", "-o", "test-reports{/}{envname}-coverage.xml"],
    ["pyrefly", "check", "sanitary/"],
]

[tool.tox.env.checks]
runner = "uv-venv-lock-runner"
groups = ["dev"]
extras = ["docs"]
skip-install = true
commands = [
    ["deptry", "."],
    ["ruff", "format", "--check", "."],
    ["ruff", "check", "."],
    ["pydocstyle", "sanitary/"],
]
